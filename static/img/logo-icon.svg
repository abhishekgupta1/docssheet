<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- folded-corner sheet body -->
  <path d="M22,8 H68 L80,20 V90 Q80,94 76,94 H22 Q18,94 18,90 V12 Q18,8 22,8 Z"
        fill="#FFC933" stroke="#1B1F3B" stroke-width="3" stroke-linejoin="round"/>
  <!-- folded corner flap -->
  <path d="M68,8 L80,20 H72 Q68,20 68,16 Z" fill="#F2994A" stroke="#1B1F3B" stroke-width="3" stroke-linejoin="round"/>
  <!-- ruled lines below face -->
  <line x1="28" y1="72" x2="70" y2="72" stroke="#F2994A" stroke-width="3" stroke-linecap="round"/>
  <line x1="28" y1="80" x2="60" y2="80" stroke="#F2994A" stroke-width="3" stroke-linecap="round"/>
  <!-- sunglasses -->
  <rect x="27" y="40" width="18" height="13" rx="6" fill="#1B1F3B"/>
  <rect x="53" y="40" width="18" height="13" rx="6" fill="#1B1F3B"/>
  <line x1="45" y1="45" x2="53" y2="45" stroke="#1B1F3B" stroke-width="3"/>
  <line x1="27" y1="43" x2="20" y2="40" stroke="#1B1F3B" stroke-width="3" stroke-linecap="round"/>
  <line x1="71" y1="43" x2="78" y2="40" stroke="#1B1F3B" stroke-width="3" stroke-linecap="round"/>
  <!-- glasses shine -->
  <circle cx="33" cy="44" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="59" cy="44" r="2" fill="#FFFFFF" opacity="0.8"/>
  <!-- smirk -->
  <path d="M38,62 Q49,70 62,60" fill="none" stroke="#1B1F3B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- blush -->
  <circle cx="30" cy="58" r="4" fill="#FF8FA3" opacity="0.6"/>
  <circle cx="68" cy="56" r="4" fill="#FF8FA3" opacity="0.6"/>
  <!-- sparkle -->
  <path d="M84,28 l2.2,5.2 5.2,2.2 -5.2,2.2 -2.2,5.2 -2.2,-5.2 -5.2,-2.2 5.2,-2.2 Z" fill="#4ECDC4"/>
</svg>
